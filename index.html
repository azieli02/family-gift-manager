<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="A simple family gift planning manager.">
  <title>Family Gift Manager</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Family Gift Manager home">
        <span class="brand-mark" aria-hidden="true">🎁</span>
        <span>Family Gift Manager</span>
      </a>
      <div class="header-actions">
        <span class="connection-status" id="connection-status">Connecting…</span>
      </div>
    </header>
    <main id="app">
      <section class="auth-panel">
        <p class="eyebrow">Loading</p>
        <h1>Family Gift Manager</h1>
        <p class="welcome-copy">Connecting to your account…</p>
      </section>
    </main>
    <footer class="app-footer">Family Gift Manager</footer>
  </div>
</body>
</html>
